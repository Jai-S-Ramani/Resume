name: Build Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Build PDF and preview
        run: |
          typst compile resume.typ Jai_S_Ramani_Resume.pdf --root .
          typst compile resume.typ resume-preview.png --format png --ppi 200 --root .

      - uses: actions/upload-artifact@v4
        with:
          name: Jai_S_Ramani_Resume.pdf
          path: Jai_S_Ramani_Resume.pdf
